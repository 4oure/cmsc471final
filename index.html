<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Anatomy of a Scoring Drive</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/visualizations.css">
  <link rel="stylesheet" href="css/story-mode.css">
</head>
<body>

<header>
  <h1>The Anatomy of a Scoring Drive</h1>
  <p>2025 NFL Season — Play-by-play drive explorer</p>
</header>

<div id="loading">
  <div class="spinner"></div>
  <span>Loading play-by-play data…</span>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>Team</label>
    <select id="sel-team"></select>
  </div>
  <div class="ctrl-group">
    <label>Week</label>
    <select id="sel-week"></select>
  </div>
  <div class="ctrl-group">
    <label>Game</label>
    <select id="sel-game"></select>
  </div>
  <div class="ctrl-group">
    <label>Drive</label>
    <select id="sel-drive"></select>
  </div>
  <button id="btn-load">Load Drive</button>
  <button id="btn-story" class="btn-story-prominent" style="display: none;">📖 Story Mode</button>
</div>

<div id="story-modal" style="display: none;">
  <div id="story-container">
    <button id="story-close" class="story-close-btn">✕</button>
    
    <div id="story-header">
      <h2 id="story-title"></h2>
      <p id="story-meta"></p>
      <div id="story-progress"></div>
    </div>
    
    <div id="story-play-viewer">
      <div id="story-play-number"></div>
      <div id="story-situation"></div>
      <div id="story-field" style="margin: 1.5rem 0;"></div>
      <div id="story-description"></div>
      <div id="story-epa-box"></div>
      <div id="story-stats"></div>
    </div>
    
    <div id="story-nav">
      <button id="story-prev">← Previous</button>
      <span id="story-counter"></span>
      <button id="story-next">Next →</button>
    </div>
  </div>
</div>

<div id="main">

  <div id="left">
    <div id="drive-header">
      <div id="drive-title">Select a drive above</div>
      <div id="drive-meta"></div>
    </div>
    <div id="play-log"></div>
    <div id="scrubber-wrap"></div>
  </div>

  <div id="right">
    <div id="empty-state">Load a drive to begin exploring</div>

    <div id="play-card" style="display:none">
      <div id="play-situation"></div>
      <div id="play-description"></div>
      <div id="play-tags"></div>
      <div id="epa-explain" style="font-size:0.78rem;margin-top:8px;line-height:1.5;"></div>
    </div>

    <div id="stat-row" style="display:none">
      <div class="stat-card"><div class="stat-val" id="s-epa">—</div><div class="stat-lbl">Cumul. EPA</div></div>
      <div class="stat-card"><div class="stat-val" id="s-yds">—</div><div class="stat-lbl">Yards gained</div></div>
      <div class="stat-card"><div class="stat-val" id="s-wp">—</div><div class="stat-lbl">Win prob.</div></div>
      <div class="stat-card"><div class="stat-val" id="s-result">—</div><div class="stat-lbl">Drive result</div></div>
    </div>

    <div id="charts-row" style="display:none">
      <div class="chart-box" id="field-box">
        <div class="chart-title">Field position</div>
        <svg id="field-svg" class="chart"></svg>
      </div>
      <div class="chart-box">
        <div class="chart-title">Expected Points Added (EPA) per play</div>
        <svg id="epa-svg" class="chart"></svg>
      </div>
      <div class="chart-box">
        <div class="chart-title">Win probability</div>
        <svg id="wp-svg" class="chart"></svg>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/visualizations.js"></script>
<script src="js/story-mode.js"></script>
<script src="js/main.js"></script>
</body>
</html>
